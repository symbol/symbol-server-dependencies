version: 2
updates:

  - package-ecosystem: pip
    schedule:
      interval: weekly
      day: sunday
    labels: [dependencies]
    commit-message:
      prefix: '[dependency]'
    target-branch: dev
    versioning-strategy: increase-if-necessary
    groups:
      pip-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    directories:
      - /scripts
